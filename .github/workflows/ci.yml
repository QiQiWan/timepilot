name: quality-check
on:
  push:
  pull_request:
jobs:
  python-31212:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Exact Python 3.12.12
        run: uv python install 3.12.12
      - name: Install single requirements.txt
        run: uv pip install --python "$(uv python find 3.12.12)" -r requirements.txt
      - name: Verify dependency contract and interpreter
        run: |
          $(uv python find 3.12.12) scripts/verify_installation.py --require-runtime
          $(uv python find 3.12.12) scripts/sync_requirements.py --check
          $(uv python find 3.12.12) -m timepilot doctor --strict
      - name: Unit, API, real DuckDB/Arrow integration
        run: $(uv python find 3.12.12) -m pytest -q -rs
      - name: Strict DuckDB/Arrow native BI gate
        run: $(uv python find 3.12.12) scripts/verify_native_bi_release.py --require-python31212 --require-duckdb
      - name: Verify P0 DataAsset and read-only view integration
        run: $(uv python find 3.12.12) -m pytest -q tests/test_p0_data_assets_v090.py tests/test_ordered_perspective_session_v0512.py tests/test_unified_agent_v100.py
      - name: Stage IV human-gold/evaluation and audited autonomous modeling
        run: $(uv python find 3.12.12) -m pytest -q tests/test_research_stage4_v0110.py
      - name: Compile and run deterministic forecasting smoke test
        run: |
          $(uv python find 3.12.12) -m compileall -q src/timepilot
          TIMEPILOT_HOME=./runtime $(uv python find 3.12.12) -m timepilot demo

  native-bi-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only release without installing forecasting packages
        run: python scripts/verify_installation.py --source-only
      - name: Resolve lockfile on build host if missing (source bootstrap only)
        run: |
          cd frontend/native-bi
          if [ ! -f package-lock.json ]; then
            echo 'WARNING: package-lock.json absent from source. Generating build-specific lock; commit the artifact to pin future releases.'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
      - name: Build pinned Perspective offline assets
        run: python scripts/build_native_bi.py
      - name: Perspective workspace unit tests
        working-directory: frontend/native-bi
        run: npm run test
      - name: Verify built JS/CSS/WASM and their SHA256 manifest
        run: python scripts/verify_native_bi_release.py --require-build
      - name: Complete compiled offline release (no runtime npm)
        run: python scripts/package_timepilot.py --with-native-bundle --output TimePilot_v0.11.0_FULL_OFFLINE.zip
      - name: Publish compiled artifacts to the CI run
        uses: actions/upload-artifact@v4
        with:
          name: timepilot-perspective-v0110-assets
          path: |
            src/timepilot/static/native-bi/
            frontend/native-bi/package-lock.json
            TimePilot_v0.11.0_FULL_OFFLINE.zip
          if-no-files-found: error

  native-bi-real-browser:
    needs: [python-31212, native-bi-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use exact Python runtime
        run: uv python install 3.12.12
      - name: Install Python dependencies in selected interpreter
        run: uv pip install --python "$(uv python find 3.12.12)" -r requirements.txt
      - name: Restore checked Perspective bundle
        uses: actions/download-artifact@v4
        with:
          name: timepilot-perspective-v0110-assets
          path: .
      - name: Verify source integrity and Python before browser integration
        run: $(uv python find 3.12.12) scripts/verify_installation.py --require-runtime --integration --require-bundle
      - name: Strict native BI release gate
        run: $(uv python find 3.12.12) scripts/verify_native_bi_release.py --require-python31212 --require-duckdb --require-build --require-source-current --require-virtual-server
      - name: Verify preinstalled Google Chrome (no browser download)
        run: $(uv python find 3.12.12) scripts/system_chrome.py --check
      - name: Real Parquet, DuckDB, Perspective WebSocket and browser acceptance
        run: $(uv python find 3.12.12) scripts/accept_native_bi_live.py
      - name: Retain structured native BI acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timepilot-native-bi-v0110-report
          path: reports/native_bi_acceptance.json
          if-no-files-found: warn

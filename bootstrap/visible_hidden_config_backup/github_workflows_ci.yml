name: TimePilot source QA and offline release
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-full:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Use exact project Python
        run: uv python install 3.12.12
      - name: Install runtime and test dependencies
        run: uv pip install --python "$(uv python find 3.12.12)" -r requirements.txt
      - name: Check release source and dependency contract
        run: |
          $(uv python find 3.12.12) scripts/verify_installation.py --require-runtime
          $(uv python find 3.12.12) scripts/sync_requirements.py --check
          $(uv python find 3.12.12) scripts/verify_native_bi_release.py --require-python31212 --require-duckdb
      - name: Full Python regression suite
        run: $(uv python find 3.12.12) -m pytest -q -rs
      - name: PIT join, advanced budgets and fail-closed gating
        run: $(uv python find 3.12.12) -m pytest -q tests/test_featurelab31_join_release.py tests/test_featurelab30_advanced.py
      - name: Production-scale native calculations and recovery
        run: |
          $(uv python find 3.12.12) scripts/accept_production_recovery.py --rows 1000000 --out reports/production_recovery_1m.json
          $(uv python find 3.12.12) scripts/benchmark_native_bi.py --rows 100000 1000000 --repeats 3 --concurrency 2 --out reports/production_native_bi_benchmark.json
      - name: Preserve runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timepilot-v031-python-evidence
          path: reports/
          if-no-files-found: warn

  advanced-real-algorithms:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install exact Python and real optional algorithm packages
        run: |
          uv python install 3.12.12
          uv pip install --python "$(uv python find 3.12.12)" -r requirements.txt -r requirements-featurelab-advanced.txt
      - name: Fail if either actual package is unavailable
        run: $(uv python find 3.12.12) -c "import tsfresh, featuretools; print('Real optional packages imported')"
      - name: Execute genuine tsfresh and Featuretools integration tests
        run: $(uv python find 3.12.12) -m pytest -q tests/test_featurelab30_optional_engines.py tests/test_featurelab30_advanced.py tests/test_featurelab31_join_release.py

  native-bi-pinned-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/native-bi/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce committed dependency lock
        run: |
          test -s frontend/native-bi/package-lock.json || {
            echo 'BLOCKED: commit verified package-lock.json from an authorized build host' >&2
            exit 2
          }
          cd frontend/native-bi && npm ci --no-audit --no-fund
      - name: Run complete Node test suite
        working-directory: frontend/native-bi
        run: npm test
      - name: Build and verify actual Perspective JS/WASM
        run: |
          python scripts/build_native_bi.py
          python scripts/verify_native_bi_release.py --require-build --require-source-current
      - name: Produce installable offline distribution
        run: python scripts/package_timepilot.py --with-native-bundle --output TimePilot_v0.31.0_FULL_OFFLINE.zip
      - name: Upload complete distribution and bundle
        uses: actions/upload-artifact@v4
        with:
          name: timepilot-v031-runtime
          path: |
            src/timepilot/static/native-bi/
            frontend/native-bi/package-lock.json
            TimePilot_v0.31.0_FULL_OFFLINE.zip
          if-no-files-found: error

  native-bi-real-browser:
    needs: [python-full, advanced-real-algorithms, native-bi-pinned-build]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Use exact Python and install test dependencies
        run: |
          uv python install 3.12.12
          uv pip install --python "$(uv python find 3.12.12)" -r requirements.txt
      - name: Restore exactly verified native bundle
        uses: actions/download-artifact@v4
        with:
          name: timepilot-v031-runtime
          path: .
      - name: Check runtime, bundle and virtual server
        run: |
          $(uv python find 3.12.12) scripts/verify_installation.py --require-runtime --integration --require-bundle
          $(uv python find 3.12.12) scripts/verify_native_bi_release.py --require-python31212 --require-duckdb --require-build --require-source-current --require-virtual-server
      - name: Enforce preinstalled Google Chrome
        run: $(uv python find 3.12.12) scripts/system_chrome.py --check
      - name: Real HTTPS browser / websocket verification
        run: |
          $(uv python find 3.12.12) scripts/accept_enterprise_browser.py --out reports/enterprise_browser_acceptance.json
          $(uv python find 3.12.12) scripts/launcher.py accept native
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timepilot-v031-browser-evidence
          path: reports/
          if-no-files-found: warn

# Enterprise production release is a separate, explicitly gated local process.
# A source CI pass, synthetic browser result or missing real plant measurements
# never substitutes for same-source PIT/model/BI and third-party algorithm receipts.

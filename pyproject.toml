[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "timepilot"
version = "0.31.0"
description = "TimePilot - industrial time-series modeling, evaluation and workflow foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "TimePilot Team"}]
dependencies = [
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
  "pyarrow>=17,<24",
  "duckdb>=1.3,<2",
  "perspective-python[starlette]==5.6.1",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "psutil>=6,<8",
  "pysindy>=2,<3",
  "autogluon.timeseries==1.6.1",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "playwright>=1.55,<2",
]

[project.scripts]
timepilot = "timepilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/timepilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

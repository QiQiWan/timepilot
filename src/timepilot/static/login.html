<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>时骁 TimePilot · 企业工作台登录</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1b293e;background:#f4f6f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px}
article{width:min(420px,100%);background:white;border:1px solid #dce4ed;border-radius:16px;padding:34px;box-shadow:0 14px 38px #14253c12}
h1{font-size:25px;margin:0 0 5px}p{color:#66768d;font-size:14px;margin:0 0 24px;line-height:1.6}
label{display:block;font-size:13px;font-weight:600;margin:0 0 16px}input{display:block;width:100%;border:1px solid #cad5e4;background:#fff;border-radius:9px;padding:12px;font:inherit;margin-top:6px}
input:focus{outline:2px solid #4b82d1}button{width:100%;background:#1c365d;color:white;padding:12px;border:0;border-radius:9px;font-weight:600;cursor:pointer}
#error{margin-top:14px;color:#b32828;min-height:18px;font-size:13px}</style></head>
<body><article><h1>时骁 TimePilot</h1><p>企业工作空间 · 使用租户分配的账户登录</p>
<form id="login-form" autocomplete="on"><label>租户标识<input name="tenant" autocomplete="organization" required maxlength="60"></label>
<label>用户名<input name="username" autocomplete="username" required maxlength="70"></label>
<label>密码<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">登录工作台</button><div id="error" role="alert" aria-live="polite"></div></form></article>
<script>document.getElementById('login-form').addEventListener('submit',async ev=>{
ev.preventDefault();const form=ev.currentTarget,box=document.getElementById('error'),button=form.querySelector('button');
button.disabled=true;box.textContent='';const info=Object.fromEntries(new FormData(form));
try{const response=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(info)});
if(!response.ok){const result=await response.json().catch(()=>({}));throw new Error(result.detail||'登录失败')}
location.replace('/projects');}catch(error){box.textContent=error.message;}finally{button.disabled=false;form.password.value=''}
});</script></body></html>
